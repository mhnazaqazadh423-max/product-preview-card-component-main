<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
     
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
             <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="card">
<picture>
  <source media="(min-width: 600px)" srcset="image-product-desktop.jpg">
  <img class="product-img" src="./images/image-product-mobile.jpg" alt="Perfume bottle">
</picture> <div class="content">
<p class="category">Perfume</p>
<h1 class="title">Gabrielle Essence Eau De Parfum</h1>
<p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
<div class="prices">
  <p class="price-now">$149.99</p>
  <p class="price-old">$169.99</p>
</div>
<button class="cart-btn">Add to Cart</button>
</div>
  </div>

  </footer> -->
</body>
</html>
